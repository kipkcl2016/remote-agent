name: Build Release Artifacts

on:
  push:
    branches:
      - 'release/**'
      - 'main'
  pull_request:
  workflow_dispatch:

jobs:
  build-gateway:
    name: Build Gateway on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        node-version: [22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: macos-agent-gateway/package-lock.json
      
      - name: Install dependencies
        working-directory: macos-agent-gateway
        run: npm ci
      
      - name: Run tests
        working-directory: macos-agent-gateway
        run: npm test
      
      - name: Type check
        working-directory: macos-agent-gateway
        run: npm run typecheck
      
      - name: Build
        working-directory: macos-agent-gateway
        run: npm run build
      
      - name: Create package
        working-directory: macos-agent-gateway
        run: npm run package

      - name: Verify Windows setup scripts in gateway package
        if: runner.os == 'Windows'
        working-directory: macos-agent-gateway
        run: node scripts/verify-windows-setup.mjs

      - name: Sign Windows gateway package (optional, Phase C)
        if: runner.os == 'Windows' && (secrets.WINDOWS_CODE_SIGNING_CERT != '' || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '')
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_CERT: ${{ secrets.WINDOWS_CODE_SIGNING_CERT }}
          WINDOWS_CODE_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERT_PASSWORD }}
          SIGNTOOL_PATH: ${{ secrets.SIGNTOOL_PATH }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          ./scripts/ci/sign-windows.ps1 -PackageDir macos-agent-gateway/packages/remote-agent-gateway -RequireSecrets

      - name: Sign macOS gateway binaries (optional, Phase C)
        if: runner.os != 'Windows' && secrets.APPLE_DEVELOPER_ID_CERT_BASE64 != ''
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_KEY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ISSUER_ID }}
          APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          bash scripts/ci/notarize-macos.sh --package-dir macos-agent-gateway/packages/remote-agent-gateway --require-secrets
      
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        working-directory: macos-agent-gateway/packages
        run: |
          tar czf remote-agent-gateway-${{ runner.os }}.tar.gz remote-agent-gateway
          ls -lh *.tar.gz

      - name: Notarize macOS installer package (optional, Phase C)
        if: runner.os != 'Windows' && (secrets.APPLE_NOTARY_API_KEY_ID != '' || secrets.APPLE_ID != '')
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_KEY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ISSUER_ID }}
          APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          PKG="macos-agent-gateway/packages/remote-agent-gateway-macos.pkg"
          if [ -f "$PKG" ]; then
            bash scripts/ci/notarize-macos.sh --artifact "$PKG" --require-secrets
          else
            echo "[release] No $PKG yet; skipping notarization until macOS .pkg ships."
          fi
      
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        working-directory: macos-agent-gateway/packages
        shell: pwsh
        run: |
          Compress-Archive -Path remote-agent-gateway -DestinationPath remote-agent-gateway-Windows.zip -Force
          Compress-Archive -Path remote-agent-gateway -DestinationPath remote-agent-gateway-Windows-setup-unsigned.zip -Force
          Get-ChildItem *.zip
      
      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: remote-agent-gateway-${{ runner.os }}
          path: macos-agent-gateway/packages/remote-agent-gateway-${{ runner.os }}.tar.gz
          retention-days: 30
      
      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: remote-agent-gateway-Windows
          path: macos-agent-gateway/packages/remote-agent-gateway-Windows.zip
          retention-days: 30

      - name: Upload artifact (Windows setup unsigned)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: remote-agent-gateway-Windows-setup-unsigned
          path: macos-agent-gateway/packages/remote-agent-gateway-Windows-setup-unsigned.zip
          retention-days: 30
  
  build-mobile-client:
    name: Build Mobile Client Bundle
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: mobile-agent-remote/package-lock.json
      
      - name: Install dependencies
        working-directory: mobile-agent-remote
        run: npm ci
      
      - name: Runtime check
        working-directory: mobile-agent-remote
        run: npm run check:runtime
      
      - name: Build client
        working-directory: mobile-agent-remote
        run: npm run build
      
      - name: Create client archive
        working-directory: mobile-agent-remote
        run: |
          tar czf ../mobile-agent-remote-client.tar.gz dist/client
          ls -lh ../*.tar.gz
      
      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-remote-client
          path: mobile-agent-remote-client.tar.gz
          retention-days: 30
