name: Build Release Artifacts

on:
  push:
    branches:
      - 'release/**'
      - 'main'
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional git ref to build (commit SHA, tag, or branch). Defaults to the triggering ref.'
        required: false
        type: string

jobs:
  build-gateway:
    name: Build Gateway on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        node-version: [22.x]
    # Map signing secrets to env once; step `if` must not reference secrets.* directly.
    env:
      WINDOWS_CODE_SIGNING_CERT: ${{ secrets.WINDOWS_CODE_SIGNING_CERT }}
      WINDOWS_CODE_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERT_PASSWORD }}
      SIGNTOOL_PATH: ${{ secrets.SIGNTOOL_PATH }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
      APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_NOTARY_API_KEY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ISSUER_ID }}
      APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: macos-agent-gateway/package-lock.json
      
      - name: Install dependencies
        working-directory: macos-agent-gateway
        run: npm ci
      
      - name: Run tests
        working-directory: macos-agent-gateway
        run: npm test
      
      - name: Type check
        working-directory: macos-agent-gateway
        run: npm run typecheck
      
      - name: Build
        working-directory: macos-agent-gateway
        run: npm run build
      
      - name: Create package
        working-directory: macos-agent-gateway
        run: npm run package

      - name: Verify Windows setup scripts in gateway package
        if: runner.os == 'Windows'
        working-directory: macos-agent-gateway
        run: node scripts/verify-windows-setup.mjs

      - name: Sign Windows gateway package (optional, Phase C)
        if: runner.os == 'Windows' && (env.WINDOWS_CODE_SIGNING_CERT != '' || env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '')
        shell: pwsh
        run: |
          ./scripts/ci/sign-windows.ps1 -PackageDir macos-agent-gateway/packages/remote-agent-gateway -RequireSecrets

      - name: Sign macOS gateway binaries (optional, Phase C)
        if: runner.os != 'Windows' && env.APPLE_DEVELOPER_ID_CERT_BASE64 != ''
        run: |
          bash scripts/ci/notarize-macos.sh --package-dir macos-agent-gateway/packages/remote-agent-gateway --require-secrets
      
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        working-directory: macos-agent-gateway/packages
        run: |
          tar czf remote-agent-gateway-${{ runner.os }}.tar.gz remote-agent-gateway
          ls -lh *.tar.gz

      - name: Notarize macOS installer package (optional, Phase C)
        if: runner.os != 'Windows' && (env.APPLE_NOTARY_API_KEY_ID != '' || env.APPLE_ID != '')
        run: |
          PKG="macos-agent-gateway/packages/remote-agent-gateway-macos.pkg"
          if [ -f "$PKG" ]; then
            bash scripts/ci/notarize-macos.sh --artifact "$PKG" --require-secrets
          else
            echo "[release] No $PKG yet; skipping notarization until macOS .pkg ships."
          fi
      
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        working-directory: macos-agent-gateway/packages
        shell: pwsh
        run: |
          Compress-Archive -Path remote-agent-gateway -DestinationPath remote-agent-gateway-Windows.zip -Force
          Compress-Archive -Path remote-agent-gateway -DestinationPath remote-agent-gateway-Windows-setup-unsigned.zip -Force
          Get-ChildItem *.zip
      
      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: remote-agent-gateway-${{ runner.os }}
          path: macos-agent-gateway/packages/remote-agent-gateway-${{ runner.os }}.tar.gz
          retention-days: 30
      
      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: remote-agent-gateway-Windows
          path: macos-agent-gateway/packages/remote-agent-gateway-Windows.zip
          retention-days: 30

      - name: Upload artifact (Windows setup unsigned)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: remote-agent-gateway-Windows-setup-unsigned
          path: macos-agent-gateway/packages/remote-agent-gateway-Windows-setup-unsigned.zip
          retention-days: 30
  
  build-mobile-client:
    name: Build Mobile Client Bundle
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: mobile-agent-remote/package-lock.json
      
      - name: Install dependencies
        working-directory: mobile-agent-remote
        run: npm ci
      
      - name: Runtime check
        working-directory: mobile-agent-remote
        run: npm run check:runtime
      
      - name: Build client
        working-directory: mobile-agent-remote
        run: npm run build
      
      - name: Create client archive
        working-directory: mobile-agent-remote
        run: |
          tar czf ../mobile-agent-remote-client.tar.gz dist/client
          ls -lh ../*.tar.gz
      
      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-remote-client
          path: mobile-agent-remote-client.tar.gz
          retention-days: 30

  build-android-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '' && github.event.inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: mobile-agent-remote/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT/cmdline-tools"
            ls -la "$ANDROID_SDK_ROOT" || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: mobile-agent-remote
        run: npm ci

      - name: Sync Capacitor (web build + native)
        working-directory: mobile-agent-remote
        run: npm run native:sync

      - name: Assemble debug APK
        working-directory: mobile-agent-remote/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK artifact
        run: |
          cp mobile-agent-remote/android/app/build/outputs/apk/debug/app-debug.apk remote-agent-android-debug.apk
          ls -lh remote-agent-android-debug.apk

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: remote-agent-android-debug
          path: remote-agent-android-debug.apk
          retention-days: 30
